version: "1.3.0"
module: "man"
description: "Mày đay mạn CIndU và CSU"

rules:
  # TẦNG 4: MÀY ĐAY CẢM ỨNG MẠN TÍNH (CIndU - CHRONIC INDUCIBLE URTICARIA)
  # =========================================================================
  - rule_id: "R-CindU-00"
    name: "Điều kiện tiên quyết CIndU"
    layer: "T4 · Mày đay cảm ứng mạn tính — CIndU"
    is_base_condition: true
    priority_label: "Tiên quyết"
    display_name: "Điều kiện tiên quyết CIndU"
    criteria_text: "Khởi phát > 6 tuần và xuất hiện khi có các yếu tố kích thích."
    conditions:
      all_of:
        - field: "thoi_gian_khoi_phat_tuan"
          operator: ">"
          value: 6
        - field: "hoan_canh_xuat_hien_san_phu"
          operator: "contains"
          value: "Khi có các yếu tố kích thích"

  - rule_id: "R-CindU-01"
    name: "Mày đay CIndU da vẽ nổi"
    layer: "T4 · Mày đay cảm ứng mạn tính — CIndU"
    target_label: "Mày đay CindU da vẽ nổi"
    priority: 6
    priority_label: "Nhóm CIndU"
    display_name: "Mày đay CIndU Da vẽ nổi"
    criteria_text: "Khởi phát > 6 tuần khi có kích thích cơ học + FricTest dương tính (+)."
    conditions:
      all_of:
        - ref_rule: "R-CindU-00"
        - field: "da_ve_noi_ket_qua"
          operator: "=="
          value: "(+)"
    decision_trace: "Mày đay mạn tính > 6 tuần xuất hiện khi có kích thích cơ học và FricTest dương tính."

  - rule_id: "R-CindU-02"
    name: "Mày đay CIndU Cholinergic"
    layer: "T4 · Mày đay cảm ứng mạn tính — CIndU"
    target_label: "Mày đay CindU Choline (do nóng)"
    priority: 6
    priority_label: "Nhóm CIndU"
    display_name: "Mày đay CIndU Cholinergic"
    criteria_text: "Xuất hiện khi nóng bức, gắng sức, mồ hôi + Test kích thích Cholinergic (+)."
    conditions:
      all_of:
        - ref_rule: "R-CindU-00"
        - field: "cholinergic_ket_qua"
          operator: "=="
          value: "(+)"
    decision_trace: "Mày đay mạn tính xuất hiện khi nóng bức, gắng sức, ra mồ hôi và test kích thích Cholinergic dương tính."

  - rule_id: "R-CindU-03"
    name: "Mày đay CIndU do lạnh"
    layer: "T4 · Mày đay cảm ứng mạn tính — CIndU"
    target_label: "Mày đay CindU do lạnh"
    priority: 6
    priority_label: "Nhóm CIndU"
    display_name: "Mày đay CIndU Do lạnh"
    criteria_text: "Xuất hiện khi tiếp xúc lạnh + Test cục đá (TempTest / Ice cube) (+)."
    conditions:
      all_of:
        - ref_rule: "R-CindU-00"
        - any_of:
            - field: "lanh_temptest_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "lanh_cucda_ket_qua"
              operator: "=="
              value: "(+)"
    decision_trace: "Mày đay mạn tính xuất hiện khi tiếp xúc nhiệt độ lạnh và test lạnh (TempTest / Ice cube) dương tính."

  - rule_id: "R-CindU-04"
    name: "Mày đay CIndU khác"
    layer: "T4 · Mày đay cảm ứng mạn tính — CIndU"
    target_label: "Mày đay CindU khác"
    priority: 6
    priority_label: "Nhóm CIndU"
    display_name: "Mày đay CIndU Thể khác"
    criteria_text: "Âm tính các test trên nhưng dương tính với áp lực chậm, ánh sáng mặt trời hoặc nước."
    conditions:
      all_of:
        - ref_rule: "R-CindU-00"
        - field: "da_ve_noi_ket_qua"
          operator: "!="
          value: "(+)"
        - field: "cholinergic_ket_qua"
          operator: "!="
          value: "(+)"
        - field: "lanh_temptest_ket_qua"
          operator: "!="
          value: "(+)"
        - any_of:
            - field: "ap_luc_cham_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "anh_sang_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "nuoc_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "khac_ket_qua"
              operator: "=="
              value: "(+)"
    decision_trace: "Mày đay cảm ứng mạn tính do yếu tố kích thích đặc thù khác (áp lực chậm, ánh sáng mặt trời, nước hoặc rung chấn)."

  # =========================================================================
  # TẦNG 5: MÀY ĐAY TỰ PHÁT MẠN TÍNH (CSU - CHRONIC SPONTANEOUS URTICARIA)
  # =========================================================================
  - rule_id: "R-CSU-00"
    name: "Điều kiện tiên quyết CSU"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    is_base_condition: true
    priority_label: "Tiên quyết"
    display_name: "Điều kiện tiên quyết CSU"
    criteria_text: "Bệnh > 6 tuần tự phát, tuổi >= 16, lưu huyết thanh, ngừng kháng H1 >= 8 ngày, corticoid >= 30 ngày."
    conditions:
      all_of:
        - field: "thoi_gian_khoi_phat_tuan"
          operator: ">"
          value: 6
        - field: "tuoi"
          operator: ">="
          value: 16
        - field: "luu_huyet_thanh"
          operator: "=="
          value: "Có"
        - field: "thoi_gian_ngung_khang_histamine_asst"
          operator: ">="
          value: 8
        - field: "thoi_gian_ngung_corticoid_asst"
          operator: ">="
          value: 30

  # Phân chia Giai đoạn 1 (ASST +) và Giai đoạn 2 (ASST -)
  - rule_id: "R-GD-01"
    name: "CSU Giai đoạn 1 (ASST dương tính)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    is_base_condition: true
    priority_label: "Tiên quyết"
    display_name: "CSU Giai đoạn 1 (ASST +)"
    criteria_text: "Đạt R-CSU-00 và ASST dương tính (+)."
    conditions:
      all_of:
        - ref_rule: "R-CSU-00"
        - field: "asst_ket_qua"
          operator: "=="
          value: "(+)"

  - rule_id: "R-GD-02"
    name: "CSU Giai đoạn 2 (ASST âm tính, đạt chuẩn Stella)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    is_base_condition: true
    priority_label: "Tiên quyết"
    display_name: "CSU Giai đoạn 2 (ASST -, Stella)"
    criteria_text: "Đạt R-CSU-00 và ASST âm tính (−), đạt chuẩn Stella hoặc IgE toàn phần < 40."
    conditions:
      all_of:
        - ref_rule: "R-CSU-00"
        - field: "asst_ket_qua"
          operator: "=="
          value: "(−)"
        - any_of:
            - field: "stella_dat"
              operator: "=="
              value: true
            - field: "ige_toan_phan"
              operator: "<"
              value: 40

  # --- Cây phân loại thể bệnh ELISA ---
  - rule_id: "R-CSU-T1-01"
    name: "Mày đay CSU Type I (Giai đoạn 1)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU type 1"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Type I (Giai đoạn 1)"
    criteria_text: "Tự dị ứng: Theo dõi >= 60 ngày, IgG kháng FcεRIα/IgE âm tính (-), IgE kháng IL-24 dương tính (+)."
    conditions:
      all_of:
        - ref_rule: "R-GD-01"
        - field: "so_ngay_theo_doi"
          operator: ">="
          value: 60
        - field: "igg_khang_fceria_ket_qua"
          operator: "=="
          value: "(−)"
        - field: "igg_khang_ige_ket_qua"
          operator: "=="
          value: "(−)"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(+)"
    decision_trace: "CSU GĐ1 (ASST +) theo dõi >= 60 ngày: IgG kháng FcεRIα/IgE âm tính, IgE kháng IL-24 dương tính (Autoallergic Endotype)."

  - rule_id: "R-CSU-T1-02"
    name: "Mày đay CSU Type I (Giai đoạn 2)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU type 1"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Type I (Giai đoạn 2)"
    criteria_text: "Tự dị ứng: ASST âm tính đạt chuẩn Stella, IgE kháng IL-24 dương tính (+)."
    conditions:
      all_of:
        - ref_rule: "R-GD-02"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(+)"
    decision_trace: "CSU GĐ2 (ASST − đạt chuẩn Stella): Kháng thể IgE kháng IL-24 dương tính (Autoallergic Endotype)."

  - rule_id: "R-CSU-T2-01"
    name: "Mày đay CSU Type IIb (Tự miễn)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU type 2"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Type IIb"
    criteria_text: "Tự miễn: Tự kháng thể IgG dương tính (+) và IgE kháng IL-24 âm tính (-)."
    conditions:
      all_of:
        - ref_rule: "R-GD-01"
        - field: "so_ngay_theo_doi"
          operator: ">="
          value: 60
        - any_of:
            - field: "igg_khang_fceria_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "igg_khang_ige_ket_qua"
              operator: "=="
              value: "(+)"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(−)"
    decision_trace: "CSU GĐ1 (ASST +) theo dõi >= 60 ngày: Tự kháng thể IgG dương tính và IgE kháng IL-24 âm tính (Autoimmune Endotype)."

  - rule_id: "R-CSU-OVL-01"
    name: "Mày đay CSU Chồng lấp (Overlap)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU overlap"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Thể chồng lấp (Overlap)"
    criteria_text: "Đồng thời dương tính cả tự kháng thể IgG (+) và IgE kháng IL-24 (+)."
    conditions:
      all_of:
        - ref_rule: "R-GD-01"
        - field: "so_ngay_theo_doi"
          operator: ">="
          value: 60
        - any_of:
            - field: "igg_khang_fceria_ket_qua"
              operator: "=="
              value: "(+)"
            - field: "igg_khang_ige_ket_qua"
              operator: "=="
              value: "(+)"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(+)"
    decision_trace: "CSU GĐ1 (ASST +) theo dõi >= 60 ngày: Đồng thời dương tính với cả tự kháng thể IgG và IgE kháng IL-24."

  - rule_id: "R-CSU-UNK-01"
    name: "Mày đay CSU Không xác định (Giai đoạn 1)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU unknown"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Không xác định (Giai đoạn 1)"
    criteria_text: "Theo dõi >= 60 ngày, cả tự kháng thể IgG và IgE kháng IL-24 đều âm tính (-)."
    conditions:
      all_of:
        - ref_rule: "R-GD-01"
        - field: "so_ngay_theo_doi"
          operator: ">="
          value: 60
        - field: "igg_khang_fceria_ket_qua"
          operator: "=="
          value: "(−)"
        - field: "igg_khang_ige_ket_qua"
          operator: "=="
          value: "(−)"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(−)"
    decision_trace: "CSU GĐ1 điểm dừng: Cả tự kháng thể IgG và IgE kháng IL-24 đều âm tính."

  - rule_id: "R-CSU-UNK-02"
    name: "Mày đay CSU Không xác định (Giai đoạn 2)"
    layer: "T5 · Mày đay tự phát mạn tính — CSU"
    target_label: "Mày đay CSU unknown"
    priority: 7
    priority_label: "Nhóm CSU"
    display_name: "Mày đay CSU Không xác định (Giai đoạn 2)"
    criteria_text: "Test ASST âm tính và IgE kháng IL-24 âm tính (-)."
    conditions:
      all_of:
        - ref_rule: "R-GD-02"
        - field: "ige_khang_il24_ket_qua"
          operator: "=="
          value: "(−)"
    decision_trace: "CSU GĐ2 điểm dừng: Test ASST âm tính và IgE kháng IL-24 âm tính."

  # =========================================================================
  # TẦNG 6: MẶC ĐỊNH / CHƯA ĐỦ DỮ LIỆU ĐỂ PHÂN LOẠI
  # =========================================================================
  - rule_id: "R-DEFAULT"
    name: "Chưa đủ dữ liệu phân loại, tiếp tục theo dõi"
    layer: "T6 · Chưa đủ dữ kiện / ngoại lệ"
    target_label: "Chưa phân loại (Tiếp tục theo dõi)"
    target_status: "INSUFFICIENT_DATA"
    priority: 8
    priority_label: "Ngoại lệ"
    display_name: "Chưa phân loại (Tiếp tục theo dõi)"
    criteria_text: "Hồ sơ mạn tính thiếu kết quả bắt buộc: ASST trống, chưa đủ 60 ngày theo dõi hoặc thiếu ELISA."
    conditions:
      any_of:
        - field: "asst_ket_qua"
          operator: "=="
          value: null
        - all_of:
            - ref_rule: "R-GD-01"
            - field: "so_ngay_theo_doi"
              operator: "<"
              value: 60
    decision_trace: "Dữ liệu chưa đủ điều kiện phân type chuyên sâu (thiếu kết quả ASST, chưa đủ 60 ngày theo dõi hoặc thiếu kết quả ELISA)."
